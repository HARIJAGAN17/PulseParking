version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: parkpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkpulse
      POSTGRES_USER: parkpulse
      POSTGRES_PASSWORD: parkpulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkpulse -d parkpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

