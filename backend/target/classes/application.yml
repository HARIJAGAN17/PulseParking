spring:
  application:
    name: parkpulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        name: PARKPULSE_SESSION
        http-only: true
        same-site: lax
        secure: false # set to true in production HTTPS
        max-age: 86400 # 24 hours

parkpulse:
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://127.0.0.1:5173"
  privacy:
    mask-peer-plates: true # Strict privacy per approved requirement

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.parkpulse: DEBUG

